<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Меню на неделю</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
body { background: #f4f7f6; color: #2d3748; padding: 20px; min-height: 100vh; }
header { text-align: center; margin-bottom: 25px; max-width: 1200px; margin: 0 auto 25px; }
h1 { font-size: 2.2rem; margin-bottom: 8px; }
.subtitle { color: #718096; font-size: 1.05rem; margin-bottom: 18px; }
.stats-container { background: #fff; padding: 15px 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; max-width: 1200px; margin: 0 auto 20px; }
.progress-info { font-weight: 600; color: #48bb78; font-size: 1.05rem; }
.reset-btn { background: #fc8181; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.95rem; }
.reset-btn:hover { background: #f56565; }
.days-nav { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 1200px; margin: 0 auto 20px; }
.day-tab { padding: 10px 18px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.95rem; background: #e2e8f0; color: #4a5568; transition: all 0.2s; }
.day-tab:hover { background: #cbd5e0; }
.day-tab.active { background: #4299e1; color: white; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(66,153,225,0.3); }
.day-tab .day-count { display: inline-block; background: rgba(255,255,255,0.3); padding: 1px 7px; border-radius: 10px; margin-left: 6px; font-size: 0.8rem; }
.day-content { display: none; max-width: 1200px; margin: 0 auto; animation: fadeIn 0.3s; }
.day-content.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; padding: 0 5px; flex-wrap: wrap; gap: 10px; }
.day-header h2 { font-size: 1.5rem; }
.day-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.action-btn { border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: all 0.2s; }
.action-btn.add { background: #48bb78; color: white; }
.action-btn.add:hover { background: #38a169; }
.action-btn.delete { background: #fc8181; color: white; }
.action-btn.delete:hover { background: #f56565; }
.action-btn.delete.active { background: #c53030; box-shadow: 0 0 0 3px rgba(197,48,48,0.3); }
.action-btn.reset { background: #ed8936; color: white; }
.action-btn.reset:hover { background: #dd6b20; }
.meal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
.meal-card { background: #fff; border-radius: 16px; padding: 22px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); border-top: 5px solid #e2e8f0; }
.meal-card.breakfast { border-top-color: #f6ad55; }
.meal-card.lunch { border-top-color: #4fd1c5; }
.meal-card.dinner { border-top-color: #63b3ed; }
.meal-card h3 { font-size: 1.3rem; margin-bottom: 15px; }
.delete-mode-label { color: #e53e3e; font-weight: 700; font-size: 0.9rem; margin-bottom: 12px; padding: 8px; background: #fed7d7; border-radius: 6px; display: none; }
.delete-mode-label.show { display: block; }
.meal-list { list-style: none; }
.meal-item { margin-bottom: 8px; position: relative; }
.meal-item label { display: flex; align-items: center; cursor: pointer; font-size: 0.95rem; padding: 8px 10px; border-radius: 8px; transition: background 0.2s; flex: 1; }
.meal-item label:hover { background-color: #f7fafc; }
.meal-item-row { display: flex; align-items: center; }
.edit-btn { background: #edf2f7; border: none; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-left: 8px; opacity: 0; transition: all 0.2s; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.meal-item:hover .edit-btn { opacity: 1; }
.edit-btn:hover { background: #bee3f8; transform: scale(1.1); }
.custom-check { width: 22px; height: 22px; border: 2px solid #cbd5e0; border-radius: 5px; margin-right: 12px; cursor: pointer; position: relative; flex-shrink: 0; }
.custom-check:checked { background-color: #48bb78; border-color: #48bb78; }
.custom-check:checked::after { content: '✓'; color: white; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 14px; font-weight: bold; }
.meal-item input:checked + span { text-decoration: underline; color: #a0aec0; }
.delete-mode .meal-item label { background: #fff5f5; border: 1px solid #feb2b2; }
.delete-mode .meal-item label:hover { background: #fed7d7; }
.delete-mode .edit-btn { display: none; }
footer { text-align: center; margin-top: 35px; color: #718096; font-size: 0.9rem; padding-bottom: 80px; }
.fab-container { position: fixed; bottom: 25px; right: 25px; display: flex; flex-direction: column; gap: 15px; z-index: 100; }
.fab { width: 64px; height: 64px; border-radius: 50%; color: white; border: none; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.2); font-size: 28px; display: flex; align-items: center; justify-content: center; transition: all 0.3s; position: relative; }
.fab:hover { transform: scale(1.1); }
.fab-recipe { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }
.fab-shop { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); box-shadow: 0 8px 20px rgba(245,87,108,0.4); }
.fab .badge { position: absolute; top: -5px; right: -5px; background: #f56565; color: white; font-size: 13px; font-weight: bold; min-width: 24px; height: 24px; border-radius: 12px; display: flex; align-items: center; justify-content: center; padding: 0 6px; border: 2px solid white; }
.fab.hidden { transform: scale(0); opacity: 0; pointer-events: none; }
.drawer { position: fixed; top: 0; right: 0; width: 480px; max-width: 100%; height: 100vh; background: white; box-shadow: -8px 0 30px rgba(0,0,0,0.15); transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1); z-index: 200; display: flex; flex-direction: column; }
.drawer.open { transform: translateX(0); }
.drawer-header { padding: 20px 25px; color: white; display: flex; justify-content: space-between; align-items: center; }
.drawer-header.recipe-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
.drawer-header.shop-header { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
.drawer-header h2 { font-size: 1.4rem; }
.close-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; }
.close-btn:hover { background: rgba(255,255,255,0.3); }
.drawer-body { padding: 20px 25px; overflow-y: auto; flex: 1; padding-bottom: 20px; }
.empty-state { text-align: center; padding: 40px 20px; color: #a0aec0; }
.empty-state .icon { font-size: 48px; margin-bottom: 15px; }
.recipe-card { background: #f7fafc; border-radius: 12px; padding: 18px; margin-bottom: 18px; border-left: 4px solid #667eea; }
.recipe-card .meal-type { display: inline-block; font-size: 0.75rem; padding: 3px 10px; border-radius: 10px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
.recipe-card .meal-type.breakfast { background: #fef3c7; color: #92400e; }
.recipe-card .meal-type.lunch { background: #d1fae5; color: #065f46; }
.recipe-card .meal-type.dinner { background: #dbeafe; color: #1e40af; }
.recipe-card h4 { font-size: 1.15rem; margin-bottom: 12px; color: #2d3748; }
.recipe-card .kcal-tag { display: inline-block; float: right; background: #edf2f7; color: #4a5568; font-size: 0.8rem; font-weight: 700; padding: 3px 10px; border-radius: 10px; }
.recipe-section { margin-bottom: 12px; }
.recipe-section-title { font-size: 0.85rem; font-weight: 700; color: #4a5568; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.recipe-section ul { list-style: none; padding-left: 0; }
.recipe-section ul li { font-size: 0.92rem; padding: 3px 0 3px 18px; position: relative; color: #4a5568; }
.recipe-section ul li::before { content: '•'; position: absolute; left: 4px; color: #667eea; font-weight: bold; }
.recipe-section ol { padding-left: 22px; }
.recipe-section ol li { font-size: 0.92rem; padding: 4px 0; color: #4a5568; line-height: 1.5; }
.calories-summary { margin-top: 20px; padding: 20px; background: linear-gradient(135deg, #f6f8fb 0%, #eef2f7 100%); border-radius: 14px; border: 2px solid #e2e8f0; text-align: center; }
.calories-summary .label { font-size: 0.85rem; color: #718096; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-bottom: 8px; }
.calories-summary .value { font-size: 2.2rem; font-weight: 800; margin-bottom: 6px; transition: color 0.3s; }
.calories-summary .value.low { color: #ed8936; }
.calories-summary .value.medium { color: #48bb78; }
.calories-summary .value.high { color: #e53e3e; }
.calories-summary .norm { font-size: 0.85rem; color: #a0aec0; }
.calories-summary .norm b { color: #4a5568; }
.calories-bar { margin-top: 12px; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
.calories-bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease, background 0.3s; }
.shop-summary { background: linear-gradient(135deg, #fff5f7 0%, #ffe4e8 100%); padding: 15px; border-radius: 12px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; }
.shop-summary .total { font-weight: 700; color: #c53030; font-size: 1.05rem; }
.shop-summary .bought { color: #48bb78; font-weight: 600; }
.shop-item { display: flex; align-items: center; padding: 12px; background: #f7fafc; border-radius: 10px; margin-bottom: 8px; transition: all 0.2s; border-left: 3px solid transparent; }
.shop-item:hover { background: #edf2f7; }
.shop-item.bought { background: #e6fffa; opacity: 0.75; border-left-color: #48bb78; }
.shop-item.bought .shop-item-text { text-decoration: line-through; color: #a0aec0; }
.shop-check { width: 22px; height: 22px; border: 2px solid #cbd5e0; border-radius: 5px; margin-right: 12px; cursor: pointer; position: relative; flex-shrink: 0; background: white; }
.shop-check:checked { background-color: #48bb78; border-color: #48bb78; }
.shop-check:checked::after { content: '✓'; color: white; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 14px; font-weight: bold; }
.shop-item-text { flex: 1; font-size: 0.98rem; color: #2d3748; font-weight: 500; }
.shop-item-source { font-size: 0.75rem; color: #a0aec0; margin-left: 8px; font-style: italic; max-width: 120px; text-align: right; }
.shop-actions { display: flex; gap: 8px; margin-top: 15px; }
.shop-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; }
.shop-btn.copy { background: #4299e1; color: white; }
.shop-btn.copy:hover { background: #3182ce; }
.shop-btn.clear { background: #e2e8f0; color: #4a5568; }
.shop-btn.clear:hover { background: #cbd5e0; }
.overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 150; }
.overlay.show { opacity: 1; pointer-events: all; }
.modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 300; }
.modal.show { display: flex; }
.modal-content { background: white; border-radius: 16px; padding: 30px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.modal-header h2 { font-size: 1.5rem; color: #2d3748; }
.modal-close { background: #e2e8f0; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 18px; }
.modal-close:hover { background: #cbd5e0; }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-weight: 600; margin-bottom: 6px; color: #4a5568; font-size: 0.95rem; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 0.95rem; font-family: inherit; transition: border-color 0.2s; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #667eea; }
.form-group textarea { resize: vertical; min-height: 80px; }
.form-hint { font-size: 0.8rem; color: #a0aec0; margin-top: 4px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 25px; }
.btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.95rem; transition: all 0.2s; }
.btn-primary { background: #667eea; color: white; }
.btn-primary:hover { background: #5a67d8; }
.btn-secondary { background: #e2e8f0; color: #4a5568; }
.btn-secondary:hover { background: #cbd5e0; }
@media (max-width: 600px) {
  h1 { font-size: 1.6rem; }
  .meal-card { padding: 18px; }
  .day-tab { padding: 8px 12px; font-size: 0.85rem; }
  .drawer { width: 100%; }
  .fab { width: 56px; height: 56px; font-size: 24px; }
  .fab-container { bottom: 20px; right: 20px; gap: 12px; }
  .day-header { flex-direction: column; align-items: flex-start; }
  .day-actions { width: 100%; justify-content: flex-start; }
  .edit-btn { opacity: 1; }
  .shop-item-source { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>🥗 Меню на неделю</h1>
  <p class="subtitle">Планируй здоровое питание на каждый день</p>
  <div class="stats-container">
    <span class="progress-info" id="weekProgress">Выбрано за неделю: 0 блюд</span>
    <button class="reset-btn" id="resetWeekBtn">🔄 Сбросить всю неделю</button>
  </div>
</header>
<nav class="days-nav" id="daysNav"></nav>
<main id="daysContainer"></main>
<footer><p>Питайся правильно и чувствуй себя отлично! 💚</p></footer>
<div class="fab-container">
  <button class="fab fab-recipe hidden" id="recipeFab" title="Рецепты">🍳<span class="badge" id="recipeBadge">0</span></button>
  <button class="fab fab-shop hidden" id="shopFab" title="Покупки">️<span class="badge" id="shopBadge">0</span></button>
</div>
<div class="overlay" id="overlay"></div>
<div class="drawer" id="recipeDrawer">
  <div class="drawer-header recipe-header">
    <h2 id="drawerTitle">🍳 Рецепты</h2>
    <button class="close-btn" id="closeRecipeDrawer">✕</button>
  </div>
  <div class="drawer-body" id="recipeDrawerBody"></div>
</div>
<div class="drawer" id="shopDrawer">
  <div class="drawer-header shop-header">
    <h2 id="shopTitle">️ Список покупок</h2>
    <button class="close-btn" id="closeShopDrawer">✕</button>
  </div>
  <div class="drawer-body" id="shopDrawerBody"></div>
</div>
<div class="modal" id="addMealModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle"> Добавить блюдо</h2>
      <button class="modal-close" id="closeModal">✕</button>
    </div>
    <form id="addMealForm">
      <div class="form-group">
        <label for="mealName">Название блюда *</label>
        <input type="text" id="mealName" required placeholder="Например: Овсянка с бананом">
      </div>
      <div class="form-group">
        <label for="mealType">Тип приёма пищи *</label>
        <select id="mealType" required>
          <option value="breakfast">Завтрак</option>
          <option value="lunch">Обед</option>
          <option value="dinner">Ужин</option>
        </select>
      </div>
      <div class="form-group">
        <label for="mealIngredients">Ингредиенты *</label>
        <textarea id="mealIngredients" required placeholder="Каждый ингредиент с новой строки"></textarea>
        <div class="form-hint">Каждый ингредиент с новой строки</div>
      </div>
      <div class="form-group">
        <label for="mealSteps">Приготовление *</label>
        <textarea id="mealSteps" required placeholder="Каждый шаг с новой строки"></textarea>
        <div class="form-hint">Каждый шаг с новой строки</div>
      </div>
      <div class="form-group">
        <label for="mealCalories">Калории (ккал) *</label>
        <input type="number" id="mealCalories" required min="0" placeholder="Например: 350">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancelAdd">Отмена</button>
        <button type="submit" class="btn btn-primary" id="submitBtn">Добавить</button>
      </div>
    </form>
  </div>
</div>
<script>
(function() {
  'use strict';
  
  var daysData = [
    { id: 'monday', name: 'Понедельник', short: 'Пн' },
    { id: 'tuesday', name: 'Вторник', short: 'Вт' },
    { id: 'wednesday', name: 'Среда', short: 'Ср' },
    { id: 'thursday', name: 'Четверг', short: 'Чт' },
    { id: 'friday', name: 'Пятница', short: 'Пт' },
    { id: 'saturday', name: 'Суббота', short: 'Сб' },
    { id: 'sunday', name: 'Воскресенье', short: 'Вс' }
  ];

  var meals = {
    breakfast: { title: '☀️ Завтрак', class: 'breakfast', items: ['Овсянка с ягодами и орехами','Омлет со шпинатом и томатами','Творог с фруктами и семенами чиа','Тост с авокадо и яйцом пашот','Греческий йогурт с медом и миндалем','Сырники с яблочным пюре','Гречневая каша с молоком','Смузи-боул с бананом и гранолой','Яйца пашот на цельнозерновом тосте','Пшенная каша с тыквой','Овсяноблин с творогом и зеленью','Фриттата с овощами и сыром'] },
    lunch: { title: '🍲 Обед', class: 'lunch', items: ['Куриная грудка с киноа и свежим салатом','Запеченная рыба с бурым рисом и овощами','Чечевичный суп с цельнозерновым хлебом','Индейка с гречкой и тушеными овощами','Боул с тунцом, овощами и оливковым маслом','Паста из цельнозерновой муки с томатным соусом и курицей','Говядина тушеная с овощами','Фаршированные перцы с рисом и мясом','Куриный бульон с лапшой и зеленью','Салат Цезарь с куриной грудкой','Ризотто с грибами и пармезаном','Запеченный лосось с картофелем и спаржей'] },
    dinner: { title: '🌙 Ужин', class: 'dinner', items: ['Салат с запеченным лососем и авокадо','Творожная запеканка без сахара','Куриное филе на пару с брокколи','Омлет с грибами и стручковой фасолью','Салат из морепродуктов с лимоном','Запеченные овощи с сыром фета','Тушеная капуста с курицей','Рыбные котлеты на пару с салатом','Кабачковые оладьи с йогуртовым соусом','Салат Нисуаз с тунцом','Фаршированные кабачки с индейкой','Легкий суп-пюре из тыквы с семечками'] }
  };

  var recipes = {
    'breakfast-0': { calories: 350, ingredients: ['Овсяные хлопья — 80 г','Молоко или вода — 200 мл','Ягоды (черника, малина) — 100 г','Орехи (миндаль, грецкий) — 30 г','Мед — 1 ч.л.'], steps: ['Залить овсянку молоком/водой, довести до кипения.','Варить на медленном огне 5-7 минут, помешивая.','Выложить в тарелку, сверху добавить ягоды.','Посыпать рублеными орехами, полить медом.'] },

  };

  var DAILY_NORM = 1800;
  var STORAGE_KEY = 'weeklyMealPlanner';
  var CUSTOM_MEALS_KEY = 'customMeals';
  var HIDDEN_BUILTIN_KEY = 'hiddenBuiltInMeals';
  var SHOP_STATE_KEY = 'shopBoughtState';
  
  var savedState = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  var customMeals = JSON.parse(localStorage.getItem(CUSTOM_MEALS_KEY) || '{"breakfast":[],"lunch":[],"dinner":[]}');
  var hiddenBuiltIn = new Set(JSON.parse(localStorage.getItem(HIDDEN_BUILTIN_KEY) || '[]'));
  var shopBought = JSON.parse(localStorage.getItem(SHOP_STATE_KEY) || '{}');
  var currentDay = 'monday';
  var deleteMode = false;
  var deleteSelections = { breakfast: [], lunch: [], dinner: [] };
  var editMode = null;

  function renderDays() {
    var daysNav = document.getElementById('daysNav');
    var daysContainer = document.getElementById('daysContainer');
    daysNav.innerHTML = '';
    daysContainer.innerHTML = '';
    
    for (var i = 0; i < daysData.length; i++) {
      var day = daysData[i];
      var tab = document.createElement('button');
      tab.className = 'day-tab' + (i === 0 ? ' active' : '');
      tab.setAttribute('data-day', day.id);
      tab.innerHTML = day.short + '<span class="day-count" id="count-' + day.id + '">0</span>';
      tab.onclick = (function(dayId) {
        return function() { switchDay(dayId); };
      })(day.id);
      daysNav.appendChild(tab);

      var dayContent = document.createElement('div');
      dayContent.className = 'day-content' + (i === 0 ? ' active' : '');
      dayContent.id = 'day-' + day.id;

      var html = '<div class="day-header"><h2>' + day.name + '</h2><div class="day-actions">';
      html += '<button class="action-btn add" data-day="' + day.id + '">➕ Добавить</button>';
      html += '<button class="action-btn delete" data-day="' + day.id + '">🗑 Удалить</button>';
      html += '<button class="action-btn reset" data-day="' + day.id + '">🔄 Сброс</button>';
      html += '</div></div>';
      html += '<div class="meal-grid">';

      var mealKeys = ['breakfast', 'lunch', 'dinner'];
      for (var m = 0; m < mealKeys.length; m++) {
        var mealKey = mealKeys[m];
        var meal = meals[mealKey];
        var customItems = customMeals[mealKey] || [];
        
        html += '<section class="meal-card ' + meal.class + '">';
        html += '<h3>' + meal.title + '</h3>';
        html += '<div class="delete-mode-label" id="delete-label-' + day.id + '-' + mealKey + '">️ Выберите блюда для удаления</div>';
        html += '<ul class="meal-list">';
        
        for (var idx = 0; idx < meal.items.length; idx++) {
          var item = meal.items[idx];
          var builtinKey = mealKey + '-' + idx;
          if (hiddenBuiltIn.has(builtinKey)) continue;
          var isChecked = (savedState[day.id] && savedState[day.id][mealKey] && savedState[day.id][mealKey][idx]) ? 'checked' : '';
          html += '<li class="meal-item"><div class="meal-item-row"><label><input type="checkbox" class="custom-check" data-day="' + day.id + '" data-meal="' + mealKey + '" data-idx="' + idx + '" ' + isChecked + '><span>' + item + '</span></label><button class="edit-btn" data-mealKey="' + mealKey + '" data-idx="' + idx + '" data-type="builtin" title="Редактировать">✏️</button></div></li>';
        }
        
        for (var cidx = 0; cidx < customItems.length; cidx++) {
          var citem = customItems[cidx];
          var globalIdx = meal.items.length + cidx;
          var isChecked = (savedState[day.id] && savedState[day.id][mealKey] && savedState[day.id][mealKey][globalIdx]) ? 'checked' : '';
          html += '<li class="meal-item"><div class="meal-item-row"><label><input type="checkbox" class="custom-check" data-day="' + day.id + '" data-meal="' + mealKey + '" data-idx="' + globalIdx + '" ' + isChecked + '><span>' + citem.name + ' ⭐</span></label><button class="edit-btn" data-mealKey="' + mealKey + '" data-idx="' + cidx + '" data-type="custom" title="Редактировать">✏️</button></div></li>';
        }
        
        html += '</ul></section>';
      }

      html += '</div>';
      dayContent.innerHTML = html;
      daysContainer.appendChild(dayContent);
    }

    attachEventListeners();
    updateCounts();
    updateShopFab();
  }

  function attachEventListeners() {
    var checkboxes = document.querySelectorAll('.custom-check');
    for (var i = 0; i < checkboxes.length; i++) {
      checkboxes[i].onchange = handleCheckboxChange;
    }

    var editBtns = document.querySelectorAll('.edit-btn');
    for (var i = 0; i < editBtns.length; i++) {
      editBtns[i].onclick = handleEditClick;
    }

    var addBtns = document.querySelectorAll('.action-btn.add');
    for (var i = 0; i < addBtns.length; i++) {
      addBtns[i].onclick = openAddModal;
    }

    var deleteBtns = document.querySelectorAll('.action-btn.delete');
    for (var i = 0; i < deleteBtns.length; i++) {
      deleteBtns[i].onclick = handleDeleteClick;
    }

    var resetBtns = document.querySelectorAll('.action-btn.reset');
    for (var i = 0; i < resetBtns.length; i++) {
      resetBtns[i].onclick = handleResetClick;
    }
  }

  function handleCheckboxChange() {
    if (deleteMode) {
      var meal = this.getAttribute('data-meal');
      var idx = parseInt(this.getAttribute('data-idx'));
      if (this.checked) {
        if (deleteSelections[meal].indexOf(idx) === -1) {
          deleteSelections[meal].push(idx);
        }
      } else {
        var pos = deleteSelections[meal].indexOf(idx);
        if (pos > -1) deleteSelections[meal].splice(pos, 1);
      }
    } else {
      var day = this.getAttribute('data-day');
      var meal = this.getAttribute('data-meal');
      var idx = parseInt(this.getAttribute('data-idx'));
      if (!savedState[day]) savedState[day] = {};
      if (!savedState[day][meal]) savedState[day][meal] = {};
      savedState[day][meal][idx] = this.checked;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(savedState));
      updateCounts();
      if (day === currentDay) { updateRecipeFab(); updateShopFab(); }
    }
  }

  function handleEditClick(e) {
    e.stopPropagation();
    e.preventDefault();
    var type = this.getAttribute('data-type');
    var mealKey = this.getAttribute('data-mealKey');
    var idx = parseInt(this.getAttribute('data-idx'));
    openEditModal(type, mealKey, idx);
  }

  function handleDeleteClick() {
    deleteMode = !deleteMode;
    this.classList.toggle('active', deleteMode);
    this.textContent = deleteMode ? '✓ Подтвердить' : '🗑 Удалить';
    
    var dayContents = document.querySelectorAll('.day-content');
    for (var i = 0; i < dayContents.length; i++) {
      dayContents[i].classList.toggle('delete-mode', deleteMode);
    }
    
    var labels = document.querySelectorAll('.delete-mode-label');
    for (var i = 0; i < labels.length; i++) {
      labels[i].classList.toggle('show', deleteMode);
    }

    if (!deleteMode) {
      deleteSelections = { breakfast: [], lunch: [], dinner: [] };
      var checkboxes = document.querySelectorAll('.custom-check');
      for (var i = 0; i < checkboxes.length; i++) {
        checkboxes[i].checked = false;
      }
    }
  }

  function handleResetClick() {
    var day = this.getAttribute('data-day');
    if (confirm('Сбросить все отметки за этот день?')) {
      delete savedState[day];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(savedState));
      var checkboxes = document.querySelectorAll('.custom-check[data-day="' + day + '"]');
      for (var i = 0; i < checkboxes.length; i++) {
        checkboxes[i].checked = false;
      }
      updateCounts();
      if (day === currentDay) { updateRecipeFab(); updateShopFab(); }
    }
  }

  document.addEventListener('click', function(e) {
    if (e.target.classList.contains('action-btn') && e.target.classList.contains('delete') && e.target.classList.contains('active')) {
      var hasSelections = deleteSelections.breakfast.length > 0 || deleteSelections.lunch.length > 0 || deleteSelections.dinner.length > 0;
      if (hasSelections) {
        if (confirm('Удалить выбранные блюда?')) {
          var mealKeys = ['breakfast', 'lunch', 'dinner'];
          for (var m = 0; m < mealKeys.length; m++) {
            var mealKey = mealKeys[m];
            var indices = deleteSelections[mealKey].slice().sort(function(a, b) { return b - a; });
            var baseCount = meals[mealKey].items.length;
            for (var i = 0; i < indices.length; i++) {
              var idx = indices[i];
              if (idx >= baseCount) {
                customMeals[mealKey].splice(idx - baseCount, 1);
              } else {
                hiddenBuiltIn.add(mealKey + '-' + idx);
              }
            }
          }
          localStorage.setItem(CUSTOM_MEALS_KEY, JSON.stringify(customMeals));
          localStorage.setItem(HIDDEN_BUILTIN_KEY, JSON.stringify(Array.from(hiddenBuiltIn)));
          deleteMode = false;
          deleteSelections = { breakfast: [], lunch: [], dinner: [] };
          var deleteBtns = document.querySelectorAll('.action-btn.delete');
          for (var i = 0; i < deleteBtns.length; i++) {
            deleteBtns[i].classList.remove('active');
            deleteBtns[i].textContent = '🗑 Удалить';
          }
          var dayContents = document.querySelectorAll('.day-content');
          for (var i = 0; i < dayContents.length; i++) {
            dayContents[i].classList.remove('delete-mode');
          }
          var labels = document.querySelectorAll('.delete-mode-label');
          for (var i = 0; i < labels.length; i++) {
            labels[i].classList.remove('show');
          }
          renderDays();
        }
      } else {
        alert('Выберите хотя бы одно блюдо для удаления');
      }
    }
  });

  function switchDay(dayId) {
    currentDay = dayId;
    var tabs = document.querySelectorAll('.day-tab');
    for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
    var contents = document.querySelectorAll('.day-content');
    for (var i = 0; i < contents.length; i++) contents[i].classList.remove('active');
    document.querySelector('.day-tab[data-day="' + dayId + '"]').classList.add('active');
    document.getElementById('day-' + dayId).classList.add('active');
    updateRecipeFab();
    updateShopFab();
  }

  document.getElementById('resetWeekBtn').onclick = function() {
    if (confirm('Сбросить все отметки за всю неделю?')) {
      savedState = {};
      localStorage.removeItem(STORAGE_KEY);
      var checkboxes = document.querySelectorAll('.custom-check');
      for (var i = 0; i < checkboxes.length; i++) checkboxes[i].checked = false;
      updateCounts();
      updateRecipeFab();
      updateShopFab();
    }
  };

  var recipeFab = document.getElementById('recipeFab');
  var recipeBadge = document.getElementById('recipeBadge');
  var recipeDrawer = document.getElementById('recipeDrawer');
  var recipeDrawerBody = document.getElementById('recipeDrawerBody');
  var drawerTitle = document.getElementById('drawerTitle');
  var overlay = document.getElementById('overlay');
  var closeRecipeDrawer = document.getElementById('closeRecipeDrawer');

  var shopFab = document.getElementById('shopFab');
  var shopBadge = document.getElementById('shopBadge');
  var shopDrawer = document.getElementById('shopDrawer');
  var shopDrawerBody = document.getElementById('shopDrawerBody');
  var shopTitle = document.getElementById('shopTitle');
  var closeShopDrawer = document.getElementById('closeShopDrawer');

  recipeFab.onclick = openRecipeDrawer;
  closeRecipeDrawer.onclick = closeDrawers;
  shopFab.onclick = openShopDrawer;
  closeShopDrawer.onclick = closeDrawers;
  overlay.onclick = closeDrawers;

  function closeDrawers() {
    recipeDrawer.classList.remove('open');
    shopDrawer.classList.remove('open');
    overlay.classList.remove('show');
  }

  function updateRecipeFab() {
    var selected = getSelectedForDay(currentDay);
    recipeBadge.textContent = selected.length;
    recipeFab.classList.toggle('hidden', selected.length === 0);
  }

  function updateShopFab() {
    var products = getMergedProductsForDay(currentDay);
    shopBadge.textContent = products.length;
    shopFab.classList.toggle('hidden', products.length === 0);
  }

  function getSelectedForDay(dayId) {
    var result = [];
    var dayState = savedState[dayId];
    if (!dayState) return result;
    var mealKeys = ['breakfast', 'lunch', 'dinner'];
    for (var m = 0; m < mealKeys.length; m++) {
      var mealKey = mealKeys[m];
      if (dayState[mealKey]) {
        var keys = Object.keys(dayState[mealKey]);
        for (var k = 0; k < keys.length; k++) {
          var idx = keys[k];
          if (dayState[mealKey][idx]) {
            var idxNum = parseInt(idx);
            var baseCount = meals[mealKey].items.length;
            var isCustom = idxNum >= baseCount;
            var builtinKey = mealKey + '-' + idxNum;
            if (!isCustom && hiddenBuiltIn.has(builtinKey)) continue;
            var name = isCustom ? customMeals[mealKey][idxNum - baseCount].name : meals[mealKey].items[idxNum];
            result.push({ mealKey: mealKey, idx: idxNum, name: name, isCustom: isCustom });
          }
        }
      }
    }
    return result;
  }

  function parseIngredient(text) {
    var match = text.match(/^(.+?)\s*[—–\-]\s*(\d+(?:[.,]\d+)?)\s*(.+)$/i);
    if (match) {
      return {
        name: match[1].trim().toLowerCase(),
        qty: parseFloat(match[2].replace(',', '.')),
        unit: match[3].trim().toLowerCase(),
        raw: text
      };
    }
    return { name: text.trim().toLowerCase(), qty: null, unit: '', raw: text };
  }

  function normalizeProductKey(parsed) {
    return parsed.name + '|' + parsed.unit;
  }

  function formatProduct(parsed) {
    if (parsed.qty !== null) {
      var qtyStr = Number.isInteger(parsed.qty) ? parsed.qty.toString() : parsed.qty.toFixed(1).replace(/\.?0+$/, '');
      return capitalize(parsed.name) + ' — ' + qtyStr + ' ' + parsed.unit;
    }
    return parsed.raw;
  }

  function capitalize(str) {
    return str.charAt(0).toUpperCase() + str.slice(1);
  }

  function getMergedProductsForDay(dayId) {
    var selected = getSelectedForDay(dayId);
    var map = {};
    
    for (var i = 0; i < selected.length; i++) {
      var item = selected[i];
      var ingredients = [];
      if (item.isCustom) {
        var customData = customMeals[item.mealKey][item.idx - meals[item.mealKey].items.length];
        ingredients = customData.ingredients;
      } else {
        var recipe = recipes[item.mealKey + '-' + item.idx];
        if (recipe) ingredients = recipe.ingredients;
      }
      for (var j = 0; j < ingredients.length; j++) {
        var ing = ingredients[j];
        var parsed = parseIngredient(ing);
        var key = normalizeProductKey(parsed);
        if (map[key]) {
          var existing = map[key];
          if (parsed.qty !== null && existing.parsed.qty !== null && parsed.unit === existing.parsed.unit) {
            existing.parsed.qty += parsed.qty;
          }
          existing.sources[item.name] = true;
        } else {
          map[key] = { parsed: { name: parsed.name, qty: parsed.qty, unit: parsed.unit, raw: parsed.raw }, sources: {} };
          map[key].sources[item.name] = true;
        }
      }
    }
    
    var result = [];
    var keys = Object.keys(map);
    keys.sort(function(a, b) { return map[a].parsed.name.localeCompare(map[b].parsed.name, 'ru'); });
    for (var i = 0; i < keys.length; i++) {
      var entry = map[keys[i]];
      result.push({
        text: formatProduct(entry.parsed),
        key: keys[i],
        sources: Object.keys(entry.sources)
      });
    }
    return result;
  }

  function openRecipeDrawer() {
    var selected = getSelectedForDay(currentDay);
    var dayName = daysData.find(function(d) { return d.id === currentDay; }).name;
    drawerTitle.textContent = '🍳 Рецепты: ' + dayName;

    var html = '';
    if (selected.length === 0) {
      html = '<div class="empty-state"><div class="icon">🍽️</div><p>Выбери хотя бы одно блюдо</p></div>';
    } else {
      var totalCalories = 0;
      for (var i = 0; i < selected.length; i++) {
        var item = selected[i];
        var mealTypeNames = { breakfast: 'Завтрак', lunch: 'Обед', dinner: 'Ужин' };
        var recipe;
        if (item.isCustom) {
          var customData = customMeals[item.mealKey][item.idx - meals[item.mealKey].items.length];
          recipe = { calories: customData.calories, ingredients: customData.ingredients, steps: customData.steps };
        } else {
          recipe = recipes[item.mealKey + '-' + item.idx];
        }
        var kcal = recipe ? recipe.calories : 0;
        totalCalories += kcal;
        html += '<div class="recipe-card">';
        html += '<span class="meal-type ' + item.mealKey + '">' + mealTypeNames[item.mealKey] + '</span>';
        html += '<span class="kcal-tag">🔥 ' + kcal + ' ккал</span>';
        html += '<div style="clear:both;"></div>';
        html += '<h4>' + item.name + (item.isCustom ? ' ⭐' : '') + '</h4>';
        if (recipe) {
          html += '<div class="recipe-section"><div class="recipe-section-title">🛒 Ингредиенты</div><ul>';
          for (var j = 0; j < recipe.ingredients.length; j++) {
            html += '<li>' + recipe.ingredients[j] + '</li>';
          }
          html += '</ul></div>';
          html += '<div class="recipe-section"><div class="recipe-section-title">👨‍🍳 Приготовление</div><ol>';
          for (var j = 0; j < recipe.steps.length; j++) {
            html += '<li>' + recipe.steps[j] + '</li>';
          }
          html += '</ol></div>';
        }
        html += '</div>';
      }

      var level = 'low', levelText = 'Легкий день', barColor = '#ed8936';
      var percent = Math.min((totalCalories / DAILY_NORM) * 100, 100);
      if (totalCalories >= DAILY_NORM * 0.9 && totalCalories <= DAILY_NORM * 1.1) { level = 'medium'; levelText = '✓ В пределах нормы'; barColor = '#48bb78'; }
      else if (totalCalories > DAILY_NORM * 1.1) { level = 'high'; levelText = '⚠ Превышена норма'; barColor = '#e53e3e'; }

      html += '<div class="calories-summary">';
      html += '<div class="label">Итого за день</div>';
      html += '<div class="value ' + level + '">' + totalCalories + ' ккал</div>';
      html += '<div class="norm">Норма: <b>' + DAILY_NORM + ' ккал</b> · ' + levelText + '</div>';
      html += '<div class="calories-bar"><div class="calories-bar-fill" style="width:' + percent + '%; background:' + barColor + ';"></div></div>';
      html += '</div>';
    }

    recipeDrawerBody.innerHTML = html;
    recipeDrawer.classList.add('open');
    overlay.classList.add('show');
  }

  function openShopDrawer() {
    var products = getMergedProductsForDay(currentDay);
    var dayName = daysData.find(function(d) { return d.id === currentDay; }).name;
    shopTitle.textContent = '🛍️ Список покупок: ' + dayName;

    var html = '';
    if (products.length === 0) {
      html = '<div class="empty-state"><div class="icon">️</div><p>Выбери блюда для списка покупок</p></div>';
    } else {
      if (!shopBought[currentDay]) shopBought[currentDay] = {};
      var boughtMap = shopBought[currentDay];
      
      var boughtCount = 0;
      for (var i = 0; i < products.length; i++) {
        if (boughtMap[products[i].key]) boughtCount++;
      }

      html += '<div class="shop-summary">';
      html += '<div class="total">Всего: ' + products.length + '</div>';
      html += '<div class="bought">Куплено: ' + boughtCount + ' / ' + products.length + '</div>';
      html += '</div>';

      for (var i = 0; i < products.length; i++) {
        var p = products[i];
        var isBought = boughtMap[p.key];
        var sourceText = p.sources.length > 1 ? p.sources.length + ' блюд' : p.sources[0];
        html += '<div class="shop-item' + (isBought ? ' bought' : '') + '">';
        html += '<input type="checkbox" class="shop-check" data-key="' + p.key + '"' + (isBought ? ' checked' : '') + '>';
        html += '<span class="shop-item-text">' + p.text + '</span>';
        html += '<span class="shop-item-source" title="' + p.sources.join(', ') + '">' + sourceText + '</span>';
        html += '</div>';
      }

      html += '<div class="shop-actions">';
      html += '<button class="shop-btn copy" id="copyShopList">📋 Скопировать</button>';
      html += '<button class="shop-btn clear" id="clearBought">🔄 Сбросить</button>';
      html += '</div>';
    }

    shopDrawerBody.innerHTML = html;

    var shopChecks = document.querySelectorAll('.shop-check');
    for (var i = 0; i < shopChecks.length; i++) {
      shopChecks[i].onchange = function() {
        var key = this.getAttribute('data-key');
        if (!shopBought[currentDay]) shopBought[currentDay] = {};
        shopBought[currentDay][key] = this.checked;
        localStorage.setItem(SHOP_STATE_KEY, JSON.stringify(shopBought));
        openShopDrawer();
      };
    }

    var copyBtn = document.getElementById('copyShopList');
    if (copyBtn) {
      copyBtn.onclick = function() {
        var text = '';
        for (var i = 0; i < products.length; i++) {
          text += '• ' + products[i].text + '\n';
        }
        navigator.clipboard.writeText('Список покупок на ' + dayName + ':\n\n' + text).then(function() {
          copyBtn.textContent = '✓ Скопировано!';
          setTimeout(function() { copyBtn.textContent = '📋 Скопировать'; }, 2000);
        }).catch(function() { alert('Не удалось скопировать'); });
      };
    }

    var clearBtn = document.getElementById('clearBought');
    if (clearBtn) {
      clearBtn.onclick = function() {
        if (confirm('Сбросить все отметки?')) {
          shopBought[currentDay] = {};
          localStorage.setItem(SHOP_STATE_KEY, JSON.stringify(shopBought));
          openShopDrawer();
        }
      };
    }

    shopDrawer.classList.add('open');
    overlay.classList.add('show');
  }

  function updateCounts() {
    var weekTotal = 0;
    for (var d = 0; d < daysData.length; d++) {
      var day = daysData[d];
      var dayCount = 0;
      if (savedState[day.id]) {
        var mealKeys = ['breakfast', 'lunch', 'dinner'];
        for (var m = 0; m < mealKeys.length; m++) {
          var meal = mealKeys[m];
          if (savedState[day.id][meal]) {
            var keys = Object.keys(savedState[day.id][meal]);
            for (var k = 0; k < keys.length; k++) {
              var idx = keys[k];
              if (savedState[day.id][meal][idx]) {
                var idxNum = parseInt(idx);
                var baseCount = meals[meal].items.length;
                if (idxNum < baseCount && hiddenBuiltIn.has(meal + '-' + idxNum)) continue;
                dayCount++;
                weekTotal++;
              }
            }
          }
        }
      }
      var countEl = document.getElementById('count-' + day.id);
      if (countEl) countEl.textContent = dayCount;
    }
    var weekProgress = document.getElementById('weekProgress');
    weekProgress.textContent = 'Выбрано за неделю: ' + weekTotal + ' блюд';
    if (weekTotal === 0) weekProgress.style.color = '#718096';
    else if (weekTotal < 7) weekProgress.style.color = '#ed8936';
    else weekProgress.style.color = '#48bb78';
  }

  var addMealModal = document.getElementById('addMealModal');
  var addMealForm = document.getElementById('addMealForm');
  var modalTitle = document.getElementById('modalTitle');
  var submitBtn = document.getElementById('submitBtn');
  var closeModalBtn = document.getElementById('closeModal');
  var cancelAddBtn = document.getElementById('cancelAdd');

  function closeModal() {
    addMealModal.classList.remove('show');
    addMealForm.reset();
    editMode = null;
  }

  closeModalBtn.onclick = closeModal;
  cancelAddBtn.onclick = closeModal;
  addMealModal.onclick = function(e) { if (e.target === addMealModal) closeModal(); };

  function openAddModal() {
    editMode = null;
    modalTitle.textContent = ' Добавить блюдо';
    submitBtn.textContent = 'Добавить';
    document.getElementById('mealType').value = 'breakfast';
    addMealModal.classList.add('show');
  }

  function openEditModal(type, mealKey, idx) {
    editMode = { type: type, mealKey: mealKey, idx: idx };
    modalTitle.textContent = '✏️ Редактировать блюдо';
    submitBtn.textContent = 'Сохранить';
    
    var data;
    if (type === 'custom') {
      data = customMeals[mealKey][idx];
    } else {
      var recipe = recipes[mealKey + '-' + idx];
      data = {
        name: meals[mealKey].items[idx],
        type: mealKey,
        ingredients: recipe.ingredients.join('\n'),
        steps: recipe.steps.join('\n'),
        calories: recipe.calories
      };
    }
    
    document.getElementById('mealName').value = data.name;
    document.getElementById('mealType').value = data.type || mealKey;
    document.getElementById('mealIngredients').value = Array.isArray(data.ingredients) ? data.ingredients.join('\n') : data.ingredients;
    document.getElementById('mealSteps').value = Array.isArray(data.steps) ? data.steps.join('\n') : data.steps;
    document.getElementById('mealCalories').value = data.calories;
    
    addMealModal.classList.add('show');
  }

  addMealForm.onsubmit = function(e) {
    e.preventDefault();
    var name = document.getElementById('mealName').value.trim();
    var type = document.getElementById('mealType').value;
    var ingredientsText = document.getElementById('mealIngredients').value.trim();
    var stepsText = document.getElementById('mealSteps').value.trim();
    var calories = parseInt(document.getElementById('mealCalories').value);

    if (!name || !ingredientsText || !stepsText || isNaN(calories)) {
      alert('Пожалуйста, заполните все поля');
      return;
    }

    var ingredients = ingredientsText.split('\n').filter(function(i) { return i.trim(); });
    var steps = stepsText.split('\n').filter(function(s) { return s.trim(); });
    var mealData = { name: name, ingredients: ingredients, steps: steps, calories: calories };

    if (editMode) {
      if (editMode.type === 'custom') {
        customMeals[editMode.mealKey][editMode.idx] = mealData;
        localStorage.setItem(CUSTOM_MEALS_KEY, JSON.stringify(customMeals));
        alert('Блюдо "' + name + '" обновлено!');
      } else {
        var builtinKey = editMode.mealKey + '-' + editMode.idx;
        hiddenBuiltIn.add(builtinKey);
        customMeals[editMode.mealKey].push(mealData);
        localStorage.setItem(HIDDEN_BUILTIN_KEY, JSON.stringify(Array.from(hiddenBuiltIn)));
        localStorage.setItem(CUSTOM_MEALS_KEY, JSON.stringify(customMeals));
        alert('Блюдо "' + name + '" сохранено как пользовательское');
      }
    } else {
      customMeals[type].push(mealData);
      localStorage.setItem(CUSTOM_MEALS_KEY, JSON.stringify(customMeals));
      alert('Блюдо "' + name + '" добавлено!');
    }

    closeModal();
    renderDays();
    updateRecipeFab();
    updateShopFab();
  };

  renderDays();
  updateRecipeFab();
  updateShopFab();
})();
</script>
</body>
</html>
